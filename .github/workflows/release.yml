name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run check:history
      - run: npm run check:provenance

  publish-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  deploy-production:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: sharktank-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Deploy the exact release tag
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHARKTANK_RELEASE: ${{ github.ref_name }}
        run: |
          set -o pipefail
          npm run deploy:wizardgangprod 2>&1 | tee /tmp/deploy.log
          version=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/deploy.log | tail -1)
          [ -n "$version" ] || { echo "::error::could not read the deployed Version ID from wrangler output"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The gate. sharktank.wizardgang.ai answers a runner with 403 and
      # `cf-mitigated: challenge`, so nothing that fetches the public site can verify a
      # deploy from CI. The authenticated Cloudflare API is not challenged.
      - name: Confirm the uploaded version is live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          npx wrangler deployments list --env wizardgangprod > /tmp/deployments.txt 2>&1 || {
            cat /tmp/deployments.txt; echo "::error::could not list deployments"; exit 1; }
          newest=$(grep -E '^Version\(s\):' /tmp/deployments.txt | tail -1)
          echo "newest deployment: $newest"
          printf '%s' "$newest" | grep -q "$VERSION" \
            || { echo "::error::the live deployment is not $VERSION"; exit 1; }
          printf '%s' "$newest" | grep -q '(100%)' \
            || { echo "::error::$VERSION is not serving 100% of traffic"; exit 1; }
          echo "Production is serving $VERSION at 100%"

      # Best effort, for the same reason. Both of these read the public site, so both are
      # unreachable from CI until a WAF skip rule exists. When the edge does answer, a
      # wrong release still fails the run.
      - name: Public evidence and identity checks
        env:
          SHARKTANK_RELEASE: ${{ github.ref_name }}
        run: |
          code=$(curl -s -o /tmp/version.json -D /tmp/headers.txt -w '%{http_code}' https://sharktank.wizardgang.ai/version.json || echo 000)
          if [ "$code" = "200" ]; then
            live=$(jq -r .release < /tmp/version.json)
            [ "$live" = "$SHARKTANK_RELEASE" ] \
              || { echo "::error::production release $live != $SHARKTANK_RELEASE"; exit 1; }
            echo "Public identity matches $SHARKTANK_RELEASE"
            npm run check:evidence -- https://sharktank.wizardgang.ai
          elif grep -qi '^cf-mitigated: *challenge' /tmp/headers.txt; then
            echo "::warning::sharktank.wizardgang.ai issued a Cloudflare managed challenge to this runner (HTTP $code), so the public identity and evidence walk could not run. The deployment was already proven above. Add a WAF skip rule to restore these checks."
          else
            echo "::warning::could not read /version.json (HTTP $code); the deployment was proven above"
          fi
