name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use repository npm
        shell: bash
        run: |
          package_manager="$(node -p "require('./package.json').packageManager")"
          expected_npm="${package_manager#npm@}"
          npm install --global "$package_manager"
          actual_npm="$(npm --version)"
          [ "$actual_npm" = "$expected_npm" ] || { echo "::error::npm $actual_npm != repository npm $expected_npm"; exit 1; }
      - run: npm ci
      - run: npm run check
      - name: Network dependency advisories
        run: npm run audit:dependencies
      - name: Verify exact release identity
        env:
          SHARKTANK_RELEASE: ${{ github.ref_name }}
        run: npm run check:release-identity

  publish-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create or verify immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SHARKTANK_RELEASE: ${{ github.ref_name }}
          SHARKTANK_RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: node scripts/release-publication.mjs

  deploy-production:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: publish-release
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
