name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify TypeScript, tests, PHP parity, build, and dependency audit
        run: npm run verify
      - name: Verify structured reconstruction history
        run: npm run check:history
      - name: Verify reconstruction provenance
        run: npm run check:provenance
      - name: Check patch whitespace
        run: git diff --check HEAD^
