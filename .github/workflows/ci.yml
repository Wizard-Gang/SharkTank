name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use repository npm
        shell: bash
        run: |
          package_manager="$(node -p "require('./package.json').packageManager")"
          expected_npm="${package_manager#npm@}"
          npm install --global "$package_manager"
          actual_npm="$(npm --version)"
          [ "$actual_npm" = "$expected_npm" ] || { echo "::error::npm $actual_npm != repository npm $expected_npm"; exit 1; }
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete credential-free repository gate
        env:
          CHANGE_EVENT_NAME: ${{ github.event_name }}
          CHANGE_PR_TITLE: ${{ github.event.pull_request.title }}
          CHANGE_HEAD_REF: ${{ github.head_ref }}
          CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGE_ACTOR: ${{ github.actor }}
        run: npm run check
      - name: Network dependency advisories
        run: npm run audit:dependencies
