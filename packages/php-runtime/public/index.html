<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snake Arena — PHP backend</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #0b0a14; color: #f3f1ff; font: 14px ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    #c { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
    .hud { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; }
    .card { background: rgba(6,5,12,.72); border: 1px solid #3a355e; border-radius: 10px; padding: 8px 14px; text-align: center; }
    .card b { font-size: 1.5rem; display: block; }
    .lb { position: fixed; top: 12px; right: 12px; width: 200px; background: rgba(6,5,12,.72); border: 1px solid #3a355e; border-radius: 10px; padding: 10px 12px; }
    .lb h2 { margin: 0 0 8px; font-size: .8rem; text-transform: uppercase; letter-spacing: .5px; color: #b9b4d6; }
    .lb ol { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
    .badge { position: fixed; bottom: 12px; left: 12px; background: rgba(6,5,12,.72); border: 1px solid #3a355e; border-radius: 10px; padding: 6px 12px; }
    .badge a { color: #a78bff; }
    a { color: #a78bff; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="card"><small>Score</small><b id="score">0</b></div>
    <div class="card"><small>Length</small><b id="length">0</b></div>
  </div>
  <div class="lb"><h2>Top Snakes</h2><ol id="lb"></ol></div>
  <div class="badge">PHP backend · <a href="/docs/">docs</a> · <a href="/status/">status</a> · <a href="/audit/">audit</a></div>
  <script src="/app.js"></script>
</body>
</html>
